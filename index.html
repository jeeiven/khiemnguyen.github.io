<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quà 20/10 dành cho bạn</title>
<style>
:root{--bg1:#fff0f6;--bg2:#ffd1e3;--ink:#7a1f4b;--card:#ffffff;--accent:#ee5a94;--soft:#ffffffb0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b0f1f;--bg2:#4d1733;--ink:#ffdbe9;--card:#3d1629;--accent:#ff7aa8;--soft:#ffffff14}}
:root[data-theme="dark"]{--bg1:#2b0f1f;--bg2:#4d1733;--ink:#ffdbe9;--card:#3d1629;--accent:#ff7aa8;--soft:#ffffff14}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;text-align:center;overflow-x:hidden}
main{position:relative;z-index:2;max-width:820px;margin:0 auto;padding:22px 14px 30px}
h1{margin:6px 0 2px;font-size:clamp(26px,6.5vw,42px);color:var(--accent)}
.sub{margin:0 0 12px;opacity:.9}
.bar{height:12px;max-width:380px;margin:6px auto 4px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9ac1,var(--accent));transition:width .5s}
#cnt{font-size:14px;margin-bottom:10px}
#stage{position:relative;height:min(62vh,520px);min-height:340px;border-radius:26px;background:var(--soft);border:2px dashed #ee5a9455;overflow:hidden}
.ic{position:absolute;width:64px;height:64px;border:0;border-radius:50%;background:var(--card);font-size:34px;cursor:pointer;box-shadow:0 6px 16px #ee5a9455;display:grid;place-items:center;padding:0;will-change:left,top}
.ic:hover{box-shadow:0 8px 22px #ee5a9499}
.ic.fly{transition:left .7s cubic-bezier(.5,-.3,.3,1.3),top .7s cubic-bezier(.5,-.3,.3,1.3),transform .7s;transform:scale(2) rotate(360deg);z-index:5}
.ic.done{opacity:.55}
.ic.done::after{content:"✓";position:absolute;right:-2px;top:-2px;background:var(--accent);color:#fff;font-size:12px;width:20px;height:20px;border-radius:50%;line-height:20px}
.ic span{display:block;animation:wob 2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(12deg) scale(1.1)}}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:99px;padding:10px 20px;font:inherit;font-size:15px;cursor:pointer;box-shadow:0 4px 12px #ee5a9466}
.btn.o{background:var(--card);color:var(--ink)}
#ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#0006;padding:20px}
#ov.on{display:flex}
.card{background:var(--card);border-radius:26px;padding:26px 22px;max-width:420px;width:100%;box-shadow:0 18px 50px #0005;animation:pop .5s}
@keyframes pop{0%{transform:scale(.5) rotate(-6deg);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.card .big{font-size:64px;animation:wob 1.6s infinite}
.card p{font-size:clamp(17px,4.6vw,21px);line-height:1.55;margin:10px 0 16px}
.card em{display:block;font-size:14px;opacity:.75;margin-bottom:14px}
.fl{position:fixed;top:-40px;z-index:1;pointer-events:none;animation:fall linear forwards}
.fl.top{z-index:30}
@keyframes fall{to{transform:translateY(112vh) rotate(500deg)}}
.hb{position:fixed;z-index:25;pointer-events:none;font-size:22px;animation:hb 1s ease-out forwards}
@keyframes hb{to{transform:translate(var(--dx),var(--dy));opacity:0}}
</style>
</head>
<body>
<main>
  <h1>🎀 Quà 20/10 🎀</h1>
  <p class="sub" id="sub"></p>
  <div class="bar"><i id="fill"></i></div>
  <div id="cnt"></div>
  <div id="stage"></div>
  <div class="row">
    <button class="btn" id="rnd">🎲 Mở ngẫu nhiên</button>
    <button class="btn o" id="snd">🔔 Âm thanh: Bật</button>
    <button class="btn o" id="rst">🔄 Chơi lại</button>
  </div>
</main>
<div id="ov"><div class="card"><div class="big" id="big"></div><p id="txt"></p><em id="from"></em><button class="btn" id="close">Đóng 💗</button></div></div>

<script>
/* ===== CHỈNH Ở ĐÂY ===== */
const CFG={
  to:"Bùi Thị Hồng",          // tên người nhận
  from:"Người gửi: Khiemdzs1tg 💌",    // lời ký tên, để "" nếu không cần
  finale:"Chúc cậu 20/10 thật rực rỡ, luôn được yêu thương và tự hào về chính mình!",
  items:[
    ["🐰","Chúc cậu luôn nhẹ nhàng với chính mình. Cậu đã cố gắng rất nhiều rồi, hôm nay cứ nghỉ ngơi nhé!"],
    ["🐱","Chúc cậu có nhiều ngày bình yên, khỏe mạnh và ngủ thật ngon sau mỗi ngày bận rộn."],
    ["🧸","Mong cậu luôn được ôm ấp bởi những người yêu thương cậu thật lòng."],
    ["🦋","Chúc cậu dám sống đúng với mình, mạnh mẽ bay đến những điều cậu mơ ước."],
    ["🍓","Chúc cậu mỗi ngày đều có một niềm vui nhỏ ngọt ngào, như quả dâu đầu mùa."],
    ["🎀","Chúc cậu thành công trong công việc và luôn được trân trọng đúng giá trị."],
    ["🌷","Phụ nữ đẹp nhất khi tự tin và hạnh phúc. Chúc cậu luôn tỏa sáng theo cách riêng!"],
    ["🐥","Cảm ơn cậu đã luôn ở đây, dịu dàng và kiên cường. Chúc mừng ngày 20/10!"]
  ]
};
/* ======================== */
const $=id=>document.getElementById(id),st=$("stage"),N=CFG.items.length;
$("sub").textContent="Gửi "+CFG.to+": hãy bắt lấy từng biểu tượng đang chạy để mở lời chúc nhé!";
let opened=new Set(),muted=false,actx,list=[],busy=false;

function chime(base){ if(muted)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  [0,4,7,12].forEach((s,i)=>{const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*.09;
  o.type="sine";o.frequency.value=base*Math.pow(2,s/12);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);
  o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.4)})}catch(e){}}

function hearts(x,y){const e=["💖","🌸","✨","💗"];for(let i=0;i<10;i++){const s=document.createElement("span");s.className="hb";s.textContent=e[i%4];s.style.left=x+"px";s.style.top=y+"px";const a=Math.random()*6.28,d=50+Math.random()*90;s.style.setProperty("--dx",Math.cos(a)*d+"px");s.style.setProperty("--dy",Math.sin(a)*d+"px");document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}

function fall(chars,top){const s=document.createElement("span");s.className="fl"+(top?" top":"");s.textContent=chars[Math.floor(Math.random()*chars.length)];s.style.left=Math.random()*100+"vw";s.style.fontSize=14+Math.random()*18+"px";const t=5+Math.random()*5;s.style.animationDuration=t+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),t*1000)}
setInterval(()=>fall(["🌸","🌷","💗"]),900);

function update(){$("fill").style.width=opened.size/N*100+"%";$("cnt").textContent="Đã mở "+opened.size+"/"+N+" lời chúc 🎁"}

function build(){st.innerHTML="";list=[];opened.clear();update();
  const W=st.clientWidth,H=st.clientHeight;
  CFG.items.forEach((it,i)=>{const el=document.createElement("button");el.className="ic";el.innerHTML="<span>"+it[0]+"</span>";el.setAttribute("aria-label","Lời chúc "+(i+1));
    const o={el,i,x:Math.random()*(W-64),y:Math.random()*(H-64),vx:(Math.random()<.5?-1:1)*(.6+Math.random()*.8),vy:(Math.random()<.5?-1:1)*(.6+Math.random()*.8),on:true,hover:false};
    el.onmouseenter=()=>o.hover=true;el.onmouseleave=()=>o.hover=false;
    el.onclick=ev=>openIt(o,ev);st.appendChild(el);list.push(o)})}

function loop(){const W=st.clientWidth,H=st.clientHeight;
  list.forEach(o=>{if(!o.on)return;const k=o.hover?.15:1;o.x+=o.vx*k;o.y+=o.vy*k;
    if(o.x<0||o.x>W-64){o.vx*=-1;o.x=Math.max(0,Math.min(W-64,o.x))}
    if(o.y<0||o.y>H-64){o.vy*=-1;o.y=Math.max(0,Math.min(H-64,o.y))}
    o.el.style.left=o.x+"px";o.el.style.top=o.y+"px"});requestAnimationFrame(loop)}

function openIt(o,ev){if(busy)return;busy=true;o.on=false;
  const r=o.el.getBoundingClientRect();hearts(r.left+32,r.top+32);chime(523+o.i*40);
  o.el.classList.add("fly");o.el.style.left=(st.clientWidth/2-32)+"px";o.el.style.top=(st.clientHeight/2-32)+"px";
  setTimeout(()=>{show(CFG.items[o.i][0],CFG.items[o.i][1],CFG.from,()=>{
    o.el.classList.remove("fly");o.el.classList.add("done");o.x=st.clientWidth/2-32;o.y=st.clientHeight/2-32;o.on=true;
    opened.add(o.i);update();busy=false;if(opened.size===N)setTimeout(finale,400)})},750)}

let after=null;
function show(e,t,f,cb){$("big").textContent=e;$("txt").textContent=t;$("from").textContent=f;after=cb;$("ov").classList.add("on")}
$("close").onclick=()=>{$("ov").classList.remove("on");if(after){const c=after;after=null;c()}};

function finale(){chime(659);for(let i=0;i<60;i++)setTimeout(()=>fall(["🌸","💖","🎀","🌷","✨"],true),i*80);
  busy=true;show("🎉","Bạn đã mở hết quà! "+CFG.finale,CFG.from,()=>{busy=false})}

$("rnd").onclick=e=>{const r=list.filter(o=>!opened.has(o.i)&&o.on);const o=r.length?r[Math.floor(Math.random()*r.length)]:list[Math.floor(Math.random()*N)];openIt(o)};
$("snd").onclick=()=>{muted=!muted;$("snd").textContent=muted?"🔕 Âm thanh: Tắt":"🔔 Âm thanh: Bật"};
$("rst").onclick=()=>{busy=false;build()};
build();loop();
</script>
</body>
</html>
